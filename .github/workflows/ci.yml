name: Node.js CI

on:
  push:
    branches: [main]     # 推送 main 分支时触发
  pull_request:
    branches: [main]     # PR 到 main 时也触发

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test